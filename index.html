<!doctype html>

<meta charset="utf-8">

<title>家庭分工日誌</title>
<style>
:root{--bg:#faf7f2;--card:#fff;--ink:#2b2622;--mute:#8a8178;--line:#ece5da;--acc:#d9822b;--yx:#3b82a0;--yr:#c2577a;--both:#6b8f5e}
@media(prefers-color-scheme:dark){:root{--bg:#1c1a18;--card:#26231f;--ink:#f0ebe4;--mute:#a39a8f;--line:#3a3530;--acc:#f0a050;--yx:#6bb3d1;--yr:#e27ea0;--both:#8fb881}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 -apple-system,"PingFang TC","Noto Sans TC","Microsoft JhengHei",sans-serif}
main{max-width:640px;margin:0 auto;padding:16px}
h1{font-size:22px;margin:8px 0 2px}
.sub{color:var(--mute);font-size:14px;margin:0 0 14px}
.date{display:flex;align-items:center;gap:8px;margin-bottom:14px}
.date button{border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:10px;padding:8px 12px;font-size:16px;cursor:pointer}
.date .d{flex:1;text-align:center;font-weight:600}
.prog{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px}
.p{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px;text-align:center}
.p b{display:block;font-size:20px}.p span{font-size:12px;color:var(--mute)}
.bar{height:5px;background:var(--line);border-radius:3px;margin-top:6px;overflow:hidden}.bar i{display:block;height:100%;background:var(--acc);width:0;transition:width .25s}
.tabs,.chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:8px}
.tabs button,.chips button{flex:none;border:1px solid var(--line);background:var(--card);color:var(--ink);border-radius:999px;padding:6px 14px;font-size:14px;cursor:pointer}
.tabs button.on,.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
h2{font-size:16px;margin:18px 0 2px}.q{font-size:12px;color:var(--mute);margin:0 0 8px}
.row{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:6px;cursor:pointer}
.row input{width:22px;height:22px;accent-color:var(--acc);flex:none}
.row .t{flex:1}.row.done .t{text-decoration:line-through;color:var(--mute)}
.f{font-size:12px;color:var(--mute);display:block}
.tag{font-size:12px;color:#fff;border-radius:999px;padding:2px 9px;flex:none}
.o-羿勳{background:var(--yx)}.o-宇茹{background:var(--yr)}.o-共同{background:var(--both)}
.foot{margin:24px 0;text-align:center;font-size:13px;color:var(--mute)}
.foot button{border:0;background:none;color:var(--mute);text-decoration:underline;cursor:pointer;font-size:13px}
.empty{text-align:center;color:var(--mute);padding:30px}
</style>
</head>
<body>

<div class="prog" id="prog"></div>
<div class="tabs" id="tabs"></div>
<div class="chips" id="chips"></div>
<div id="list"></div>
<div class="foot"><button id="reset">清除這天的勾選</button><br>勾選紀錄儲存在此裝置瀏覽器中</div>
</main>

const WHO=['全部','羿勳','宇茹','共同'];
const $=s=>document.querySelector(s);
let day=ymd(new Date()),who='全部',cat='全部';
function ymd(d){return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0')}
function shift(n){const d=new Date(day+'T00:00:00');d.setDate(d.getDate()+n);day=ymd(d);render()}
const key=()=>'myhome-done-'+day;
function load(){try{return JSON.parse(localStorage.getItem(key())||'{}')}catch(e){return{}}}
function save(o){try{localStorage.setItem(key(),JSON.stringify(o))}catch(e){}}
function render(){
  const done=load(),wk='日一二三四五六'[new Date(day+'T00:00:00').getDay()];
  $('#dl').textContent=day+'（週'+wk+'）'+(day===ymd(new Date())?' · 今天':'');
  // progress
  $('#prog').innerHTML=['羿勳','宇茹','共同'].map(w=>{
    const a=DATA.items.filter(i=>i.o===w),n=a.filter(i=>done[i.t]).length,p=a.length?Math.round(n/a.length*100):0;
    return `<div class="p"><span>${w}</span><b>${n}/${a.length}</b><div class="bar"><i style="width:${p}%"></i></div></div>`}).join('');
  $('#tabs').innerHTML=WHO.map(w=>`<button class="${w===who?'on':''}" data-w="${w}">${w}</button>`).join('');
  $('#chips').innerHTML=['全部',...Object.keys(DATA.names)].map(c=>`<button class="${c===cat?'on':''}" data-c="${c}">${c==='全部'?c:c+' '+DATA.names[c]}</button>`).join('');
  let h='';
  for(const c of Object.keys(DATA.names)){
    if(cat!=='全部'&&cat!==c)continue;
    const it=DATA.items.filter(i=>i.c===c&&(who==='全部'||i.o===who));
    if(!it.length)continue;
    h+=`<h2>${c} ${DATA.names[c]}</h2><p class="q">${DATA.quotes[c]}</p>`;
    h+=it.map(i=>`<label class="row ${done[i.t]?'done':''}"><input type="checkbox" data-t="${i.t}" ${done[i.t]?'checked':''}><span class="t">${i.t}<span class="f">${i.f}</span></span><span class="tag o-${i.o}">${i.o}</span></label>`).join('');
  }
  $('#list').innerHTML=h||'<div class="empty">沒有項目</div>';
}
document.addEventListener('click',e=>{
  const b=e.target.closest('button');if(!b)return;
  if(b.dataset.w){who=b.dataset.w;render()}
  else if(b.dataset.c){cat=b.dataset.c;render()}
});
document.addEventListener('change',e=>{
  const t=e.target.dataset.t;if(!t)return;
  const o=load();e.target.checked?o[t]=1:delete o[t];save(o);render();
});
$('#prev').onclick=()=>shift(-1);$('#next').onclick=()=>shift(1);
$('#today').onclick=()=>{day=ymd(new Date());render()};
$('#reset').onclick=()=>{if(confirm('清除'+day+'的勾選？')){save({});render()}};
// 跨午夜自動換日
setInterval(()=>{const t=ymd(new Date());if(window._t&&window._t!==t&&day===window._t){day=t;render()}window._t=t},60000);window._t=ymd(new Date());
